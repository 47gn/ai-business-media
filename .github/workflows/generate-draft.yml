name: Generate review draft

on:
  schedule:
    - cron: "30 0 * * *" # 09:30 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-review-draft
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and validate one article draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python scripts/generate_article.py
      - name: Commit review-ready draft
        run: |
          git config user.name "AI Media Draft Bot"
          git config user.email "actions@github.com"
          git add _drafts/ keywords.csv
          git diff --cached --quiet || git commit -m "Create review draft"
          git push
